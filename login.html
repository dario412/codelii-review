<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Codelii Review</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#002B2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-dot"></div>
    <div class="brand">Codelii<span> Review</span></div>
    <h1 id="auth-title">Sign in</h1>
    <p class="sub" id="auth-sub">Access your projects and leave visual feedback with your team.</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-signin" data-mode="signin">Sign in</button>
      <button type="button" class="auth-tab" id="tab-signup" data-mode="signup">Sign up</button>
    </div>

    <div class="error-box" id="auth-error"></div>

    <form id="auth-form">
      <div class="field" id="name-field" hidden>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Jane Smith" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@company.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;margin-top:6px" id="auth-btn">Sign in</button>
    </form>

    <div class="divider">or</div>
    <div class="google-wrap" id="google-btn"></div>
    <p class="auth-note" id="google-note">Google sign-in appears when GOOGLE_CLIENT_ID is configured.</p>
  </div>
</div>

<script>
(function () {
  const TOKEN_KEY = 'review_token';
  const USER_KEY = 'review_user';
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect') || '/dashboard.html';
  let mode = params.get('mode') === 'signup' ? 'signup' : 'signin';

  if (localStorage.getItem(TOKEN_KEY)) {
    window.location.replace(decodeURIComponent(redirect));
    return;
  }

  const form = document.getElementById('auth-form');
  const errorEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-btn');
  const nameField = document.getElementById('name-field');
  const nameInput = document.getElementById('name');
  const passwordInput = document.getElementById('password');

  function setMode(next) {
    mode = next;
    document.getElementById('tab-signin').classList.toggle('active', mode === 'signin');
    document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
    document.getElementById('auth-title').textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    document.getElementById('auth-sub').textContent =
      mode === 'signup'
        ? 'Create an account to start reviewing sites and inviting collaborators.'
        : 'Access your projects and leave visual feedback with your team.';
    nameField.hidden = mode !== 'signup';
    nameInput.required = mode === 'signup';
    passwordInput.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    btn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
  }

  document.querySelectorAll('.auth-tab').forEach((tab) => {
    tab.addEventListener('click', () => setMode(tab.dataset.mode));
  });
  setMode(mode);

  function saveAndGo(data) {
    localStorage.setItem(TOKEN_KEY, data.token);
    localStorage.setItem(USER_KEY, JSON.stringify(data.user));
    window.location.replace(decodeURIComponent(redirect));
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';

    const payload = {
      email: document.getElementById('email').value.trim(),
      password: passwordInput.value,
    };
    if (mode === 'signup') payload.name = nameInput.value.trim();

    try {
      const res = await fetch(mode === 'signup' ? '/api/auth/signup' : '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      saveAndGo(data);
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    }
  });

  window.__onGoogleCredential = async (response) => {
    errorEl.classList.remove('show');
    try {
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Google sign-in failed');
      saveAndGo(data);
    } catch (err) {
      showError(err.message);
    }
  };

  async function initGoogle() {
    try {
      const res = await fetch('/api/auth/config');
      if (!res.ok) return;
      const data = await res.json();
      if (!data.googleClientId) return;

      document.getElementById('google-note').hidden = true;
      const start = () => {
        if (!window.google?.accounts?.id) {
          setTimeout(start, 100);
          return;
        }
        google.accounts.id.initialize({
          client_id: data.googleClientId,
          callback: window.__onGoogleCredential,
        });
        google.accounts.id.renderButton(document.getElementById('google-btn'), {
          theme: 'outline',
          size: 'large',
          width: 360,
          text: 'continue_with',
        });
      };
      start();
    } catch {
      /* ignore */
    }
  }
  initGoogle();
})();
</script>
</body>
</html>
